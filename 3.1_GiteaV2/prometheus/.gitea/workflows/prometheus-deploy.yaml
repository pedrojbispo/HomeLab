name: Prometheus CI/CD
run-name: ${{ gitea.actor }} Prometheus Automation 🚀
on: [push]

jobs:
 deploy:
    runs-on: ubuntu-latest
    steps:
     - name: Check out repository code
       uses: actions/checkout@v4
     - name: create ssh folder
       run: mkdir -p ~/.ssh
     - name: setup ssh key
       run: echo "${{ secrets.GITKEY }}" > ~/.ssh/id_rsa
     - name: setup ssh key permissions
       run: chmod 600 ~/.ssh/id_rsa
     - name: copy compose file to server
       run: scp -o StrictHostKeyChecking=no compose.yaml autopilot@dockge-dev-node03.mgnt.msrls.net:/apps/prometheus
     - name: copy configuration file to server
       run: scp -ro StrictHostKeyChecking=no data/* autopilot@dockge-dev-node03.mgnt.msrls.net:/apps/prometheus/data
     - name: spin up the container
       run: ssh -o StrictHostKeyChecking=no autopilot@dockge-dev-node03.mgnt.msrls.net "cd /apps/prometheus && sudo docker compose up -d --force-recreate"
     - run: echo "This job's status is ${{ job.status }}."
     