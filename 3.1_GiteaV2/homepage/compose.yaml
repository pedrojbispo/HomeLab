version: "3.3"
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    env_file: .env
    volumes:
      - ./data:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PUID: 999
      PGID: 995
networks: {}
x-dockge:
  urls:
    - https://home.app.msrls.net/
