- Proxmox Cluster:
    - PVE01 Dev Node:
        href: https://ptdevpve01.infra.msrls.net/
        icon: proxmox
        description: PVE01 DEV and CORE Node
        siteMonitor: https://ptdevpve01.infra.msrls.net/
        widget:
           type: proxmox
           url: https://ptdevpve01.mgnt.msrls.net:8006
           username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
           password: "{{HOMEPAGE_VAR_PROXMOX_API_KEY}}"
           node: ptdevpve01
    - PVE02 Dev Node:
        href: https://ptdevpve02.infra.msrls.net/
        icon: proxmox
        description: PVE02 DEV Node
        siteMonitor: https://ptdevpve02.infra.msrls.net/
        widget:
           type: proxmox
           url: https://ptdevpve02.mgnt.msrls.net:8006
           username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
           password: "{{HOMEPAGE_VAR_PROXMOX_API_KEY}}"
           node: ptdevpve02   
    - PVE01 Prod Node:
        href: https://ptprodpve01.infra.msrls.net
        icon: proxmox
        description: PVE01 PROD Node
        siteMonitor: https://ptprodpve01.infra.msrls.net
        widget:
           type: proxmox
           url: https://ptprodpve01.mgnt.msrls.net:8006
           username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
           password: "{{HOMEPAGE_VAR_PROXMOX_API_KEY}}"
           node: ptprodpve01
    - PVE02 Prod Node:
        href: https://ptprodpve02.infra.msrls.net
        icon: proxmox
        description: PVE02 PROD Node
        siteMonitor: https://ptprodpve02.infra.msrls.net
        widget:
           type: proxmox
           url: https://ptprodpve02.mgnt.msrls.net:8006
           username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
           password: "{{HOMEPAGE_VAR_PROXMOX_API_KEY}}"
           node: ptprodpve02
- Systems:
   - NAS Server:
        href: https://ptprodnas01v.infra.msrls.net
        icon: truenas-scale
        description: Gaia01A TrueNAS
        siteMonitor: https://ptprodnas01v.infra.msrls.net
        widget:
           type: truenas
           url: https://ptprodnas01v.infra.msrls.net
           key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}" # not required if using username / password
           enablePools: true # optional, defaults to false
           nasType: scale # defaults to scale, must be set to 'core' if using enablePools with TrueNAS Core
   - Pi-Hole Upstream DNS:
        href: https://us-dns01.internal.msrls.net
        icon: pi-hole
        description: Pi-Hole Upstream DNS Server
        siteMonitor: https://us-dns01.internal.msrls.net
        widget:
           type: pihole
           url: http://us-dns01.mgnt.msrls.net
           key: "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}"
