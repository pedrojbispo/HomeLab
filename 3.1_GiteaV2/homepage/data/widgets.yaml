---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/service-widgets

- logo:
    icon: https://gitea.dev.msrls.net/MistyDev/msrls-assets/raw/branch/main/logo.png

- greeting:
    text_size: xl
    text: MSRLS | HomeLab Dashboard

- resources:
    cpu: true
    cputemp: true
    tempmin: 0
    tempmax: 100
    memory: true
    uptime: true
    units: metric
    disk: /

- datetime:
    text_size: xl
    locale: pt
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

